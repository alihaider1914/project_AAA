<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Smart Study Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">

    <!-- Logo -->
    <div class="auth-logo">
      <div class="brand-icon-lg"><i class="bi bi-mortarboard-fill"></i></div>
      <h2>Create your account</h2>
      <p>Start organizing your studies today — free</p>
    </div>

    <!-- Alert -->
    <div id="alertBox" class="alert d-none mb-3 py-2 px-3" role="alert" style="font-size:.85rem;border-radius:9px"></div>

    <!-- Form -->
    <form id="signupForm" novalidate>
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <div class="input-group">
          <span class="input-group-text" style="border-radius:9px 0 0 9px;background:#f8fafc;border:1.5px solid #e2e8f0;border-right:none">
            <i class="bi bi-person text-muted"></i>
          </span>
          <input type="text" class="form-control" id="name" placeholder="Ali Hassan" required
                 style="border-left:none;border-radius:0 9px 9px 0">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Email Address</label>
        <div class="input-group">
          <span class="input-group-text" style="border-radius:9px 0 0 9px;background:#f8fafc;border:1.5px solid #e2e8f0;border-right:none">
            <i class="bi bi-envelope text-muted"></i>
          </span>
          <input type="email" class="form-control" id="email" placeholder="you@example.com" required
                 style="border-left:none;border-radius:0 9px 9px 0">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text" style="border-radius:9px 0 0 9px;background:#f8fafc;border:1.5px solid #e2e8f0;border-right:none">
            <i class="bi bi-lock text-muted"></i>
          </span>
          <input type="password" class="form-control" id="password" placeholder="Min. 6 characters" required
                 style="border-left:none;border-radius:0 9px 9px 0">
          <button type="button" class="btn btn-outline-secondary" id="togglePass"
                  style="border-radius:0 9px 9px 0;border:1.5px solid #e2e8f0;border-left:none;background:#f8fafc">
            <i class="bi bi-eye" id="eyeIcon"></i>
          </button>
        </div>
        <div id="pwStrength" class="mt-1" style="height:4px;border-radius:4px;background:#e2e8f0;overflow:hidden">
          <div id="pwBar" style="height:100%;width:0%;border-radius:4px;transition:width .3s,background .3s"></div>
        </div>
        <small id="pwHint" class="text-muted" style="font-size:.75rem"></small>
      </div>
      <div class="mb-4">
        <label class="form-label">Confirm Password</label>
        <div class="input-group">
          <span class="input-group-text" style="border-radius:9px 0 0 9px;background:#f8fafc;border:1.5px solid #e2e8f0;border-right:none">
            <i class="bi bi-lock-fill text-muted"></i>
          </span>
          <input type="password" class="form-control" id="confirmPassword" placeholder="Repeat password" required
                 style="border-left:none;border-radius:0 9px 9px 0">
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 mb-3" id="submitBtn">
        <i class="bi bi-person-plus me-2"></i>Create Account
      </button>
    </form>

    <div class="auth-divider">or</div>

    <div class="text-center" style="font-size:.875rem">
      Already have an account?
      <a href="login.html" class="fw-700 text-decoration-none" style="color:#4f46e5">Log in</a>
    </div>
    <div class="text-center mt-2">
      <a href="index.html" class="text-muted text-decoration-none" style="font-size:.8rem">
        <i class="bi bi-arrow-left me-1"></i>Back to home
      </a>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const form      = document.getElementById('signupForm');
  const alertBox  = document.getElementById('alertBox');
  const submitBtn = document.getElementById('submitBtn');
  const pwInput   = document.getElementById('password');
  const pwBar     = document.getElementById('pwBar');
  const pwHint    = document.getElementById('pwHint');

  document.getElementById('togglePass').addEventListener('click', function() {
    const show = pwInput.type === 'password';
    pwInput.type = show ? 'text' : 'password';
    document.getElementById('eyeIcon').className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
  });

  pwInput.addEventListener('input', () => {
    const v = pwInput.value;
    let strength = 0;
    if (v.length >= 6)  strength++;
    if (v.length >= 10) strength++;
    if (/[A-Z]/.test(v)) strength++;
    if (/[0-9]/.test(v)) strength++;
    if (/[^A-Za-z0-9]/.test(v)) strength++;
    const pct = (strength / 5) * 100;
    const colors = ['', '#ef4444', '#f59e0b', '#f59e0b', '#10b981', '#10b981'];
    const hints  = ['', 'Very weak', 'Weak', 'Fair', 'Strong', 'Very strong'];
    pwBar.style.width = pct + '%';
    pwBar.style.background = colors[strength] || '#e2e8f0';
    pwHint.textContent = hints[strength] || '';
    pwHint.style.color = colors[strength] || '';
  });

  function showAlert(msg, type) {
    alertBox.className = `alert alert-${type} mb-3 py-2 px-3`;
    alertBox.innerHTML = `<i class="bi bi-${type === 'danger' ? 'x-circle' : type === 'success' ? 'check-circle' : 'exclamation-triangle'}-fill me-2"></i>${msg}`;
    alertBox.classList.remove('d-none');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name     = document.getElementById('name').value.trim();
    const email    = document.getElementById('email').value.trim();
    const password = pwInput.value;
    const confirm  = document.getElementById('confirmPassword').value;

    if (!name || !email || !password || !confirm) {
      showAlert('Please fill in all fields.', 'warning'); return;
    }
    if (password !== confirm) {
      showAlert('Passwords do not match.', 'danger'); return;
    }
    if (password.length < 6) {
      showAlert('Password must be at least 6 characters.', 'warning'); return;
    }

    submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating account…';
    submitBtn.disabled = true;

    try {
      const res  = await fetch('api/register.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password }),
      });
      const data = await res.json();

      if (data.success) {
        showAlert('Account created! Redirecting to login…', 'success');
        form.reset();
        setTimeout(() => window.location.href = 'login.html', 1500);
      } else {
        showAlert(data.message || 'Registration failed. Try again.', 'danger');
        submitBtn.innerHTML = '<i class="bi bi-person-plus me-2"></i>Create Account';
        submitBtn.disabled = false;
      }
    } catch {
      showAlert('Connection error. Is the server running?', 'danger');
      submitBtn.innerHTML = '<i class="bi bi-person-plus me-2"></i>Create Account';
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
